<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css">
<style>
  /* Lies exactly over the page: drag a rectangle, then write a comment. */
  html, body { background: transparent; cursor: crosshair; overflow: hidden; }
  #shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .18); }
  #rect { position: fixed; display: none; border: 2px solid var(--accent); border-radius: 3px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .28); background: transparent; }
  body.has-rect #shade { display: none; }
  /* ⌥ held: the mouse goes to the page (see annotate.js). */
  body.through, body.through .note .num { cursor: default; }
  /* Kept notes: their area and number (a click on it opens the note again). */
  .note { position: fixed; border: 2px solid var(--accent); border-radius: 3px; background: color-mix(in srgb, var(--accent) 8%, transparent); pointer-events: none; }
  .note .num { position: absolute; top: -11px; left: -11px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 600; line-height: 22px; text-align: center; cursor: pointer; pointer-events: auto; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  /* The element of a mark is no longer on the page: the mark stays where it was last. */
  .note.gone, #rect.gone { border-style: dashed; }
  .note.gone { background: transparent; }
  /* The kept notes lie in a box over the page; a number may stick out of it a little. */
  #notes { position: fixed; overflow: clip; overflow-clip-margin: 12px; pointer-events: none; }
  #notes .note { position: absolute; }
  /* Marks out of view: a sign at the top or bottom edge (a click scrolls to them). */
  .edge { position: fixed; display: none; transform: translateX(-50%); padding: 3px 10px; border-radius: 11px; background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 600; line-height: 16px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .edge:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
  .note .num:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
  #form { position: fixed; display: none; width: 460px; padding: 14px; border-radius: 12px; background: var(--page); cursor: default; font-size: 13.5px;
    box-shadow: 0 10px 32px rgba(0,0,0,.28), 0 0 0 .5px var(--border); }
  #form textarea { width: 100%; min-height: 96px; resize: vertical; border: 0; outline: 0; border-radius: 8px; padding: 9px 10px; background: var(--field);
    font: inherit; font-size: 14px; line-height: 1.4; color: inherit; -webkit-user-select: text; user-select: text; }
  #form textarea:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  #form .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  #form .row .grow { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.4; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The key of a button, quiet beside its label. */
  #form kbd { font: inherit; font-size: 12px; opacity: .55; margin-left: 2px; }
  #send kbd { opacity: .75; margin-left: 0; }
  #form button { padding: 6px 12px; font-size: 13px; }
  #send { background: var(--accent); color: #fff; display: flex; gap: 6px; align-items: center; }
  #send:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  /* Dictation: hold the microphone button (or Space in the field) and talk. */
  #dictation { display: none; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--field); font-size: 12.5px; color: var(--text-3); }
  body.dictation #dictation { display: flex; }
  #mic { display: flex; align-items: center; gap: 6px; padding: 5px 10px; color: var(--text); background: var(--page); box-shadow: 0 0 0 .5px var(--border); border-radius: 8px; -webkit-user-select: none; }
  #mic:hover:not(:disabled) { background: var(--page); filter: brightness(.97); }
  body.listening #mic, body.listening #mic:hover:not(:disabled) { background: #e0443e; color: #fff; box-shadow: none; filter: none; }
  #lang { font: inherit; font-size: 12px; color: var(--text-2); background: none; border: 0; padding: 2px 0; max-width: 140px; }
  #dictState { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Signal of the microphone: a bar that follows the level. */
  #meter { display: none; width: 72px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text-3) 25%, transparent); overflow: hidden; flex: none; }
  #meter i { display: block; height: 100%; width: 0; border-radius: 3px; background: #e0443e; transition: width 80ms linear; }
  body.listening #meter { display: block; }
  body.listening #form textarea { box-shadow: 0 0 0 3px color-mix(in srgb, #e0443e 45%, transparent); }
  body.busy #mic { opacity: .5; }
</style>
<div id="shade"></div>
<div id="rect"></div>
<div id="notes"></div>
<button id="above" class="edge"></button>
<button id="below" class="edge"></button>
<div id="form">
  <textarea id="text" placeholder="What about this area?" title="⇧↵ new line"></textarea>
  <div id="dictation">
    <button id="mic" title="Hold to talk (or hold Space in the field)"><span data-icon="mic" class="small"></span>Hold to talk</button>
    <span id="dictState"><span id="meter"><i></i></span><span id="dictText"></span></span>
    <select id="lang" title="Language of dictation"></select>
  </div>
  <div class="row">
    <span class="grow" id="target"></span>
    <button id="cancel">Cancel</button>
    <button id="add" title="Keep this note and mark another area: all go out together">Add <kbd>⌘↵</kbd></button>
    <button id="send" title="Send all notes (⇧↵ makes a new line)"><span data-icon="send" class="small"></span><span id="sendText">Send</span><kbd>↵</kbd></button>
  </div>
</div>
<script src="icons.js"></script>
<script src="annotate.js"></script>

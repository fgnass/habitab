<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css">
<style>
  /* Above the status bar, over the page: the hovered link's URL; it goes away with the hover. */
  html, body { background: transparent; overflow: hidden; }
  #bubble { position: fixed; bottom: 0; left: 0; max-width: 100%; height: 100%; display: flex; align-items: center; padding: 0 9px; font-size: 12px;
    color: var(--text); background: var(--bar); border: 1px solid var(--border); border-left: 0; border-bottom: 0; border-top-right-radius: 7px; }
  body.right #bubble { left: auto; right: 0; border-left: 1px solid var(--border); border-right: 0; border-top-right-radius: 0; border-top-left-radius: 7px; }
</style>
<div id="bubble" class="ellipsis"></div>
<script src="link.js"></script>

<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css">
<style>
  body { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 36px 0 10px; background: var(--bar); border-bottom: 1px solid var(--border); font-size: 12px; overflow: hidden; }
  input { font: inherit; color: inherit; height: 24px; width: 50px; border: 0; border-radius: 6px; background: var(--field); padding: 0 6px; outline: 0; text-align: center; font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; }
  input:focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); }
  button { height: 24px; display: grid; place-items: center; padding: 0; }
  .x { color: var(--text-3); }
  .sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
  /* Quiet notes: the scale of a page that is zoomed to fit, and who set the size. */
  .note { color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }
  /* A dimension that follows the free space: shown, but quiet. */
  input.auto { color: var(--text-3); }
  /* Tailwind breakpoints: set the width, the height keeps filling. */
  .bps { display: flex; gap: 2px; }
  .bps button { padding: 0 7px; font-size: 11.5px; color: var(--text-2); }
  .bps button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #close { position: absolute; right: 6px; top: 50%; translate: 0 -50%; width: 26px; }
  /* Too narrow for everything: the breakpoints matter most, the size next. */
  @media (max-width: 480px) { .note { display: none; } }
  @media (max-width: 400px) { .size { display: none; } }
</style>
<span id="bps" class="bps"></span>
<span class="sep size"></span>
<span class="size"><input id="w" title="Width" inputmode="numeric"> <span class="x">×</span> <input id="h" title="Height" inputmode="numeric"></span>
<span id="zoom" class="note hidden"></span>
<span id="by" class="note hidden">· set by the agent</span>
<button id="close" title="Leave responsive mode (⇧⌘M)"><span data-icon="x"></span></button>
<script src="icons.js"></script>
<script src="responsive.js"></script>

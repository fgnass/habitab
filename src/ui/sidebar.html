<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; background: transparent; }
  header { height: 52px; flex: none; -webkit-app-region: drag; }
  /* Without vibrancy and traffic lights (Linux, Windows). */
  :root:not([data-platform=darwin]) body { background: var(--sidebar); }
  :root:not([data-platform=darwin]) header { height: 12px; }
  .search { margin: 0 12px 6px; position: relative; }
  .search input { width: 100%; border: 0; outline: 0; border-radius: 7px; padding: 6px 8px 6px 28px; background: var(--field); }
  .search input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .search .icon { position: absolute; left: 8px; top: 6px; opacity: .45; }
  main { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }

  /* One row per active tab: a thumbnail of the page (same size in both
     sidebar widths), next to it page title, status and project. */
  .card { position: relative; display: flex; gap: 10px; align-items: center; padding: 8px 6px; margin: 0 -6px; border-radius: 8px; }
  /* Hairlines between rows only; none next to a highlighted row. */
  .card:hover { background: var(--hover); }
  .card.sel { background: var(--selected); }
  .thumb { position: relative; flex: none; width: 64px; height: 48px; border-radius: 6px; overflow: hidden; background: var(--field); box-shadow: 0 0 0 .5px var(--border); }
  .card.sel .thumb { box-shadow: 0 0 0 2px var(--accent); }
  .thumb .own.badge { position: absolute; left: 2px; bottom: 2px; width: 16px; height: 16px; padding: 0; border-radius: 8px; display: grid; place-items: center;
    background: var(--page); color: var(--text); box-shadow: 0 0 0 .5px var(--border); }
  .thumb .own.badge .icon { width: 11px; height: 11px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .info { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 12.5px; }
  .status { font-size: 11.5px; color: var(--accent); }
  .status.held { color: #b7791f; }
  .status.quiet { color: var(--text-3); }
  .client { width: 14px; height: 14px; flex: none; display: grid; color: var(--text); }
  .client svg { width: 14px; height: 14px; }
  .meta { display: flex; align-items: center; gap: 6px; margin-top: 1px; font-size: 11.5px; color: var(--text-3); }
  .meta .host { min-width: 0; flex: 1; }
  .meta .icon { width: 12px; height: 12px; color: var(--text-3); flex: none; }

  /* A session: a quiet header line, its tabs below; a hairline between sessions. */
  .session { padding-bottom: 8px; }
  .session + .session { border-top: 1px solid var(--border); padding-top: 6px; }
  .session.ended { opacity: .55; }
  .session .head { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 0 0 1px; font-size: 11px; font-weight: 600; color: var(--text-3); }
  .session.current .head { color: var(--text-2); }
  .head .client { width: 12px; height: 12px; } .head .client svg { width: 12px; height: 12px; }
  .head .project { min-width: 0; }
  .head .dot { width: 6px; height: 6px; } .head .dot.held { background: #e0a42a; }
  .head .flags { display: flex; gap: 4px; align-items: center; } .head .flags .icon { width: 11px; height: 11px; color: var(--text-3); }
  .head .more { margin-left: auto; padding: 0 4px; line-height: 1; color: var(--text-2); visibility: hidden; }
  .session:hover .head .more { visibility: visible; }

  /* Tabs the agents left open behind their current one. */
  .inactive { margin-top: 14px; }
  .inactive > button { width: 100%; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-3); padding: 3px 0; display: flex; gap: 4px; align-items: center; }
  .inactive > button:hover { background: none; color: var(--text-2); }
  .inactive > button .icon { width: 12px; height: 12px; transition: transform .15s; }
  .inactive .count { font-weight: 500; font-size: 10.5px; padding: 0 6px; border-radius: 8px; background: var(--field); color: var(--text-2); margin-left: 2px; }
  .inactive.open > button .icon { transform: rotate(90deg); }
  .inactive .rows { display: none; }
  .inactive.open .rows { display: block; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; font-size: 12px; }
  .tab:hover { background: var(--hover); }
  .tab .t { flex: 1; min-width: 0; }
  .tab .p { color: var(--text-3); font-size: 11px; max-width: 40%; }
  .tab .x { visibility: hidden; padding: 0 3px; line-height: 1; color: var(--text-2); }
  .tab:hover .x { visibility: visible; }

  footer { flex: none; padding: 6px 8px 10px; }
  footer button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; color: var(--text-2); font-size: 12.5px; text-align: left; }
  footer button:hover:not(:disabled) { color: var(--text); }
  .errors { flex: none; margin: 0 10px 8px; padding: 7px 9px; border-radius: 8px; font-size: 11.5px; background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--text); display: none; }
  .errors.show { display: block; }
  .errors .row { display: flex; gap: 6px; align-items: baseline; }
  .errors button { font-size: 11px; padding: 1px 5px; color: var(--text-2); }
  .empty { padding: 30px 6px; color: var(--text-2); text-align: center; font-size: 12px; }

  /* Thumbnails only. */
  body.compact .search, body.compact .info, body.compact .inactive, body.compact footer, body.compact .empty, body.compact .errors { display: none; }
  body.compact main { padding: 4px 10px 12px; }
  body.compact .card { padding: 0; margin: 0 0 10px; border: 0; }
  /* Thumbnails only: a thin line between sessions instead of the header. */
  body.compact .session { padding: 0; }
  body.compact .session + .session { padding-top: 10px; }
  body.compact .session .head { display: none; }
  body.compact .card:hover, body.compact .card.sel { background: none; }
</style>
<header></header>
<div class="search">
  <span data-icon="search"></span>
  <input id="q" placeholder="Pages, projects, URLs" spellcheck="false">
</div>
<main id="list"></main>
<div id="errors" class="errors"></div>
<footer>
  <button id="setup"><span data-icon="settings"></span>Setup</button>
</footer>
<script src="icons.js"></script>
<script src="tools.js"></script>
<script src="client-icons.js"></script>
<script src="sidebar.js"></script>

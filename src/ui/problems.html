<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css">
<style>
  /* Lies under the top bar, over the page: the front tab's console errors and failed requests. */
  html, body { background: transparent; overflow: hidden; }
  /* Room for the shadow: the view is larger than the panel. */
  body { padding: 0 14px 22px; }
  #panel { display: flex; flex-direction: column; max-height: calc(100vh - 22px); border-radius: 10px; background: var(--page);
    box-shadow: 0 6px 18px rgba(0,0,0,.18), 0 0 0 .5px var(--border); overflow: hidden; }
  header { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--border); }
  header h1 { flex: 1; margin: 0; font-size: 12.5px; font-weight: 600; }
  header .count { font-weight: 500; color: var(--text-3); margin-left: 4px; }
  header button { font-size: 12px; padding: 4px 9px; display: flex; gap: 6px; align-items: center; }
  #sendAll { background: var(--accent); color: #fff; }
  #sendAll:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  #list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .row { display: flex; gap: 8px; padding: 6px 8px 6px 12px; align-items: flex-start; }
  .row:hover { background: var(--hover); }
  .row > .icon { margin-top: 2px; color: var(--red); }
  .row .body { flex: 1; min-width: 0; }
  .row .text { font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; -webkit-user-select: text; user-select: text; cursor: text; }
  .row .sub { margin-top: 2px; font-size: 11px; color: var(--text-3); display: flex; gap: 6px; }
  .row .sub .src { min-width: 0; }
  .row .times { flex: none; font-weight: 600; color: var(--red); }
  .row .send { flex: none; visibility: hidden; padding: 3px 5px; color: var(--accent); }
  .row:hover .send { visibility: visible; }
  .empty { padding: 18px 12px; color: var(--text-2); font-size: 12px; text-align: center; }
  footer { flex: none; padding: 6px 12px 8px; font-size: 11px; color: var(--text-3); border-top: 1px solid var(--border); }
</style>
<div id="panel">
  <header>
    <h1>Problems<span class="count" id="count"></span></h1>
    <button id="clear" title="Remove the list (the next problems of this page appear again)">Clear</button>
    <button id="sendAll"><span data-icon="send" class="small"></span>Send All to Agent</button>
  </header>
  <div id="list"></div>
  <footer id="target"></footer>
</div>
<script src="icons.js"></script>
<script src="problems.js"></script>
